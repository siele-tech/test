# Sales Pulse CI/CD pipeline
#
#   1 · Python lint & tests (3.12, 3.13) ──────────────┐
#   1 · Workflow lint ─────────────────────────────────┤
#   2 · Data quality gate ──► 3 · Web lint/test/build ─┴─► ✅ All checks ─► 4 · Deploy ─► 5 · Smoke test
#                                                          (preview on PRs, production on main)
#
# Bad data or a failing test stops the pipeline before anything is deployed,
# so the live dashboard always shows the last good version.

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button (also used by the daily data refresh)

permissions:
  contents: read

concurrency:
  # One run per PR / branch. New pushes to a PR cancel the outdated run; runs on main queue up.
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  VERCEL_CLI_VERSION: "60"

jobs:
  # ─────────────────────────────── Stage 1 ───────────────────────────────
  python:
    name: 1 · Python lint & tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: data-pipeline/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Unit tests + coverage (min 85%)
        run: pytest --cov --cov-report=term-missing

  workflow-lint:
    name: 1 · Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Lint GitHub Actions workflows
        run: |
          pip install actionlint-py
          actionlint -color

  # ─────────────────────────────── Stage 2 ───────────────────────────────
  data-quality:
    name: 2 · Data quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: data-pipeline/pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Validate every sales file
        run: sales-pipeline validate

      - name: Export dashboard data
        run: sales-pipeline export --out ../web/src/data/dashboard.json

      - name: Upload dashboard data
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: web/src/data/dashboard.json
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────── Stage 3 ───────────────────────────────
  web:
    name: 3 · Web lint, test & build
    needs: data-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: Download dashboard data
        uses: actions/download-artifact@v5
        with:
          name: dashboard-data
          path: web/src/data

      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build (Next.js)
        run: npm run build

  # Single required check for branch protection — covers every job above, including the matrix.
  checks-passed:
    name: ✅ All checks passed
    if: always()
    needs: [python, workflow-lint, data-quality, web]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every upstream job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed ($r) — nothing will be deployed."
              exit 1
            fi
          done

  # ─────────────────────────────── Stage 4 ───────────────────────────────
  deploy-preview:
    name: 4 · Deploy preview (Vercel)
    # Pull requests only. PRs from forks get no secrets, so they skip deployment.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: checks-passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to comment the preview URL on the PR
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: Download dashboard data
        uses: actions/download-artifact@v5
        with:
          name: dashboard-data
          path: web/src/data

      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: |
          npm ci
          npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          NEXT_PUBLIC_DEPLOY_ENV: preview

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "## 🔍 Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the PR
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- sales-pulse-preview -->";
            const body = [
              marker,
              "### 🔍 Preview deployment ready",
              "",
              `**URL:** ${process.env.PREVIEW_URL}`,
              `**Commit:** \`${context.sha.slice(0, 7)}\``,
              "",
              "Every check passed (lint, tests, data quality, build). Review the dashboard before merging.",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  deploy-production:
    name: 4 · Deploy production (Vercel)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks-passed
    runs-on: ubuntu-latest
    environment:
      # Add required reviewers to this environment in GitHub settings for a manual approval gate.
      name: production
      url: ${{ vars.PRODUCTION_URL || steps.deploy.outputs.url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never cancel a production deploy halfway
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: Download dashboard data
        uses: actions/download-artifact@v5
        with:
          name: dashboard-data
          path: web/src/data

      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: |
          npm ci
          npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          NEXT_PUBLIC_DEPLOY_ENV: production

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "## 🚀 Production deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: $url" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────── Stage 5 ───────────────────────────────
  smoke-test:
    name: 5 · Smoke test production
    needs: deploy-production
    # Needs the public production URL (repo variable PRODUCTION_URL, e.g. https://sales-pulse.vercel.app).
    if: vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site serves this commit
        env:
          URL: ${{ vars.PRODUCTION_URL }}
          SHA: ${{ github.sha }}
        run: |
          short="${SHA:0:7}"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$URL" | grep -q "$short"; then
              echo "✅ $URL is live and serving commit $short"
              echo "## ✅ Smoke test passed — $URL is serving commit \`$short\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: commit $short not live yet, retrying in 10s…"
            sleep 10
          done
          echo "::error::$URL is not serving commit $short after 60s"
          exit 1
