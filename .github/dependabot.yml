# Keeps dependencies and GitHub Actions up to date. Every update arrives as a PR,
# which runs the full pipeline (and gets its own preview deployment) before merging.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /data-pipeline
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        update-types: [minor, patch]
